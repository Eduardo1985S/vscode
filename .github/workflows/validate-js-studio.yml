name: Validate JS Studio Core

on:
  push:
    branches:
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Check Scratchpad JavaScript syntax
        run: |
          node --check extensions/scratchpad/out/extension.js
          node --check extensions/scratchpad/media/scratchpad.js

      - name: Validate JSON manifests
        run: |
          node -e "const fs=require('fs'); for (const f of ['product.json','extensions/scratchpad/package.json','extensions/theme-dracula/package.json','extensions/javascript/snippets/javascript.code-snippets','extensions/typescript-basics/snippets/typescript.code-snippets']) JSON.parse(fs.readFileSync(f,'utf8')); console.log('JSON OK')"

      - name: Verify JS Studio focus
        shell: bash
        run: |
          grep -q '"nameShort": "JS Studio"' product.json
          grep -q '"enableTelemetry": false' product.json
          grep -q "COLOR_THEME_DARK = 'Dracula'" src/vs/workbench/services/themes/common/workbenchThemeService.ts
          ! grep -q "contrib/chat/browser/chat.contribution" src/vs/workbench/workbench.common.main.ts
          ! grep -q "contrib/inlineChat/browser/inlineChat.contribution" src/vs/workbench/workbench.common.main.ts
          ! grep -q "contrib/mcp/browser/mcp.contribution" src/vs/workbench/workbench.common.main.ts
