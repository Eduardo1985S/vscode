name: Build JS Studio Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Install npm dependencies
        run: |
          npm ci --prefer-offline
          npm install -D innosetup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Built-in Extensions
        run: npm run download-builtin-extensions

      - name: Compile sources
        run: npm run compile

      - name: Package VS Code Win32 x64
        run: npm run gulp vscode-win32-x64

      - name: Build Inno Setup User Installer (.exe)
        run: |
          npm run gulp vscode-win32-x64-user-setup
          if (Test-Path ".build/win32-x64/user-setup/VSCodeSetup.exe") {
            Copy-Item ".build/win32-x64/user-setup/VSCodeSetup.exe" ".build/win32-x64/user-setup/JS-Studio-UserSetup-x64.exe"
          }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JS-Studio-Windows-Installer
          path: .build/win32-x64/user-setup/*.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: .build/win32-x64/user-setup/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
